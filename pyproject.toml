[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krx-fundamentals-client"
version = "0.1.0"
description = "국내 기업 펀더멘탈 Python 클라이언트 라이브러리 — 재무제표·투자지표·배당·종목 스크리닝 (DART + KRX + 네이버)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/krx_fundamentals_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
